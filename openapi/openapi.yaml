  /rdap/nameserver/{name}:
    get:
      tags: [Optional lookups]
      summary: Look up a nameserver (not currently implemented)
      operationId: getNameserver
      description: |
        **Not currently implemented** — the `.ee` service currently serves domain lookups
        only; nameserver lookups return `501 Not Implemented` for every method. Reserved for a
        future release.
      parameters:
        - name: name
          in: path
          required: true
          description: The nameserver host name (A-label).
          schema: { type: string }
          example: ns1.example.ee
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /rdap/entity/{handle}:
    get:
      tags: [Optional lookups]
      summary: Look up an entity / registrar (not currently implemented)
      operationId: getEntity
      description: |
        **Not currently implemented** — the `.ee` service currently serves domain lookups
        only; entity lookups return `501 Not Implemented` for every method. Reserved for a
        future release.
      parameters:
        - name: handle
          in: path
          required: true
          description: The entity handle (registrar code).
          schema: { type: string }
          example: REG-001
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /rdap/domains:
    get:
      tags: [Optional lookups]
      summary: Domain search (optional, disabled by default)
      operationId: searchDomains
      description: |
        Searches domains by name pattern (RFC 9082 §3.2.1 / RFC 9083 §8). **Optional
        endpoint, gated by a server feature flag that is OFF by default** — unless the operator
        has enabled it, this path returns `501 Not Implemented` for every method.

        Each result reuses the exact per-domain shape of `GET /rdap/domain/{name}` (filtered
        to the caller's disclosure tier) and links to its own exact-lookup URL. If the result
        set exceeds the server maximum it is shortened and a §9 truncation notice is appended;
        the response never reveals a total-match count.
      parameters:
        - name: name
          in: query
          required: true
          description: The domain name search pattern (may contain `*`).
          schema: { type: string }
          example: exam*.ee
      responses:
        '200':
          description: The search-result set.
          content:
            application/rdap+json:
              schema: { $ref: '#/components/schemas/DomainSearchResults' }
              example:
                rdapConformance: ["rdap_level_0"]
                notices:
                  - title: Search results truncated
                    type: result set truncated due to excessive load
                    description:
                      - The result set exceeded the server maximum and was shortened.
                      - Narrow the search pattern to retrieve more specific results.
                domainSearchResults:
                  - objectClassName: domain
                    ldhName: example.ee
                    status: [active]
                    links:
                      - value: https://st-rdap.infra.tld.ee/rdap/domain/example.ee
                        rel: self
                        href: https://st-rdap.infra.tld.ee/rdap/domain/example.ee
                        type: application/rdap+json
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /:
    get:
      tags: [Authentication]
      summary: Human entry point (the eeID surface)
      operationId: root
      security:
        - {}
      description: |
        The site root serves the human-facing ".ee RDAP" page — the same server-rendered
        eeID surface as `GET /rdap/farv1_session/login`: a **Log in with eeID** button and a
        domain-lookup box. This is the front door for a person who types the bare hostname.
        (Programmatic clients use `/rdap/help` and the JSON endpoints directly.)
      responses:
        '200':
          description: The ".ee RDAP" HTML surface with the Log-in control.
          content:
            text/html: {}

  /rdap/farv1_session/login:
    get:
      tags: [Authentication]
      summary: eeID login surface (browser)
      operationId: sessionLogin
      security:
        - {}
      description: |
        The human-facing eeID login surface (RFC 9560 `farv1`, session-oriented mode). Open
        this in a browser and sign in with eeID. On success the callback
        (`/rdap/farv1_session/callback`, the registered OpenID Connect `redirect_uri`,
        handled by the OmniAuth middleware) validates the eeID login, establishes a browser
        session, and — proving that login — **mints an RDAP API token and renders it exactly
        once** on the token page, with a ready-to-copy example:

        ```
        curl -sS -H "Authorization: Bearer <rdap-api-token>" \
          https://st-rdap.infra.tld.ee/rdap/domain/<name>.ee | jq .
        ```

        The eeID `id_token` itself is never shown, never used as a Bearer credential, and
        never persisted — RDAP hands back its OWN opaque token instead. The raw token is not
        retrievable after this page; mint more, list, and revoke them via the endpoints below.
      responses:
        '200':
          description: The eeID login HTML surface (when not yet signed in).
          content:
            text/html: {}

  /rdap/farv1_session/token:
    post:
      tags: [Authentication]
      summary: Mint another RDAP API token
      operationId: sessionMintToken
      description: |
        Mints an additional RDAP API token for the signed-in caller and renders it **once**.
        Requires the browser session established at login (an anonymous caller is redirected
        to the login surface). Choose the token **class** — `session` (~8 h, the default) or
        `machine` (~90 d, for scripts / CI) — and an optional free-text `label`.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token_class:
                  type: string
                  enum: [session, machine]
                  default: session
                label:
                  type: string
                  description: Optional free-text label to recognise the token later.
      responses:
        '200':
          description: The one-shot token page (HTML) showing the freshly minted raw token.
          content:
            text/html: {}
        '302':
          description: >-
            The caller is not signed in (redirect to the login surface), or a transient
            registry-side error prevented the mint (redirect back to the login surface with a
            "temporarily unavailable" alert). The endpoint never returns a raw 5xx.

  /rdap/farv1_session/tokens:
    get:
      tags: [Authentication]
      summary: List and manage the caller's tokens
      operationId: sessionListTokens
      description: |
        Lists the signed-in caller's OWN tokens — metadata only (class, label, a short hash
        id, issue / expiry / last-used timestamps), **never** a raw token — each with a revoke
        control. Scoped to the caller's own subject. Anonymous callers are redirected to the
        login surface.
      responses:
        '200':
          description: The token-management page (HTML).
          content:
            text/html: {}
        '302':
          description: >-
            The caller is not signed in (redirect to the login surface), or a transient
            registry-side error prevented listing (redirect back with a "temporarily
            unavailable" alert). The endpoint never returns a raw 5xx.

  /rdap/farv1_session/tokens/revoke:
    post:
      tags: [Authentication]
      summary: Revoke one of the caller's tokens
      operationId: sessionRevokeToken
      description: |
        Revokes a single token by its hash id — but only if it belongs to the caller (a
        subject can never revoke another subject's token). Revoking one token leaves the
        caller's other tokens valid. Idempotent.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token_hash:
                  type: string
                  description: The keyed-HMAC hash id of the caller's token to revoke.
              required: [token_hash]
      responses:
        '302':
          description: >-
            Redirect back to the token-management page with a confirmation flash (or, on a
            transient registry-side error, back to the login surface with a "temporarily
            unavailable" alert). The endpoint never returns a raw 5xx.

  /rdap/farv1_session/tokens/revoke_all:
    post:
      tags: [Authentication]
      summary: Revoke ALL of the caller's tokens
      operationId: sessionRevokeAllTokens
      description: |
        Revokes every token the signed-in caller holds (the self "kill-all"), scoped to the
        caller's own subject. Use after a suspected leak.
      responses:
        '302':
          description: >-
            Redirect back to the token-management page with a confirmation flash (or, on a
            transient registry-side error, back to the login surface with a "temporarily
            unavailable" alert). The endpoint never returns a raw 5xx.

  /rdap/farv1_session/status:
    get:
      tags: [Authentication]
      summary: Current session state
      operationId: sessionStatus
      description: Reports the current browser session state. PII-safe — only an `authenticated` boolean.
      responses:
        '200':
          description: Session state.
          content:
            application/rdap+json:
              example: { authenticated: true }

  /rdap/farv1_session/refresh:
    get:
      tags: [Authentication]
      summary: Extend the local session idle clock
      operationId: sessionRefresh
      description: |
        Extends the local session idle timer and reports state. The service keeps **no**
        OIDC refresh token (data minimisation), so a true token refresh is unavailable;
        `tokenRefreshSupported` is always `false`. Never errors.
      responses:
        '200':
          description: Session state after refresh.
          content:
            application/rdap+json:
              example: { authenticated: true, refreshed: true, tokenRefreshSupported: false }

  /rdap/farv1_session/logout:
    get:
      tags: [Authentication]
      summary: Sign out
      operationId: sessionLogout
      description: |
        Clears the local session. When the eeID issuer advertises an `end_session_endpoint`,
        also triggers RP-initiated logout at eeID; otherwise degrades to a local clear and a
        redirect back. Never errors.
      responses:
        '302':
          description: Redirect to the eeID end-session endpoint or back to the login surface.

  /up:
    get:
      tags: [Operations]
      summary: Health check (non-RDAP)
      operationId: health
      security:
        - {}
      description: Liveness probe — checks database and Redis reachability. Not an RDAP endpoint.
      responses:
        '200':
          description: Service healthy.
        '503':
          description: A dependency (database or Redis) is unavailable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        An **RDAP-issued API token** (an opaque string — not a JWT) minted after
        eeID login and shown once on the token page. Optional: when present
        and active it elevates the response to the authenticated tier, and to the privileged
        tier if an active registry grant exists for the token's subject. A missing / unknown /
        expired / revoked token is treated as anonymous, never rejected.

  parameters:
    DomainName:
      name: name
      in: path
      required: true
      description: The `.ee` domain name, as an A-label (`xn--nide-loa.ee`) or U-label (`näide.ee`).
      schema:
        type: string
      example: example.ee

  responses:
    NotFound:
      description: |
        Not found / out of scope. Returned for an unknown record **or** a syntactically valid
        but non-`.ee` (out-of-scope) exact lookup. The message is generic and never reveals
        whether a specific record exists.
      content:
        application/rdap+json:
          schema: { $ref: '#/components/schemas/RdapError' }
          example:
            rdapConformance: ["rdap_level_0"]
            lang: en
            errorCode: 404
            title: Not Found
            description: ["The requested object does not exist or is out of scope."]
    MethodNotAllowed:
      description: The HTTP method is not allowed on this path (only `GET`/`HEAD` are).
      content:
        application/rdap+json:
          schema: { $ref: '#/components/schemas/RdapError' }
          example:
            rdapConformance: ["rdap_level_0"]
            lang: en
            errorCode: 405
            title: Method Not Allowed
            description: ["This method is not supported on this resource."]
    TooManyRequests:
      description: Rate limit exceeded. Carries a `Retry-After` header (RFC 6585 §4).
      headers:
        Retry-After:
          description: Seconds (or an HTTP-date) until the caller may retry.
          schema: { type: string }
          example: "60"
      content:
        application/rdap+json:
          schema: { $ref: '#/components/schemas/RdapError' }
          example:
            rdapConformance: ["rdap_level_0"]
            lang: en
            errorCode: 429
            title: Too Many Requests
            description: ["Rate limit exceeded. Retry after the period indicated by the Retry-After header."]
    NotImplemented:
      description: |
        Not implemented. Returned for the **entity** and **nameserver** lookups (which this
        service does not currently serve), for **domain search** when its feature flag is
        disabled, and for the unimplemented query types `autnum` and `ip`.
      content:
        application/rdap+json:
          schema: { $ref: '#/components/schemas/RdapError' }
          example:
            rdapConformance: ["rdap_level_0"]
            lang: en
            errorCode: 501
            title: Not Implemented
            description: ["This query type is not supported by this service."]
  schemas:
    RdapConformance:
      type: array
      items: { type: string }
      description: RDAP extension identifiers supported by the response.
      example: ["rdap_level_0"]

    Link:
      type: object
      description: An RFC 8288 web link.
      properties:
        value: { type: string, format: uri }
        rel: { type: string, example: self }
        href: { type: string, format: uri }
        type: { type: string, example: application/rdap+json }

    Notice:
      type: object
      properties:
        title: { type: string }
        type:
          type: string
          description: Present on machine-typed notices (e.g. a truncation notice).
        description:
          type: array
          items: { type: string }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }

    Event:
      type: object
      properties:
        eventAction:
          type: string
          description: e.g. `registration`, `expiration`, `last changed`.
        eventDate: { type: string, format: date-time }

    VcardArray:
      type: array
      description: >-
        A jCard (RFC 7095): the two-element array `["vcard", [ [property, params, type,
        value], ... ]]`. Withheld names retain empty fn; other withheld properties are removed.
        2027 organization-country ADR uses cc; registrar formatted ADR uses label, each with seven empty components.
      example:
        - vcard
        - - [version, {}, text, "4.0"]
          - [fn, {}, text, Example Org OÜ]
          - [kind, {}, text, org]

    Entity:
      type: object
      properties:
        objectClassName: { type: string, example: entity }
        roles:
          type: array
          items: { type: string }
          description: e.g. `registrant`, `administrative`, `technical`, `registrar`.
        vcardArray: { $ref: '#/components/schemas/VcardArray' }
        publicIds:
          type: array
          description: >-
            2027 org registrant code at detailed/privileged; org contact codes privileged-only.
            Legacy org registrant codes remain public until activation.
          items:
            type: object
            properties:
              type: { type: string, example: ee-registry-code }
              identifier: { type: string }
        events:
          type: array
          description: Entity last changed from blob timestamps, privileged-only under 2027.
          items: { $ref: '#/components/schemas/Event' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }

    Nameserver:
      type: object
      description: >-
        A nameserver embedded in a domain. Legacy is hostname-only. From 2027 activation,
        nameserver_records supplies ipAddresses.v4/v6 at every tier; empty families are omitted.
        Older blobs fall back to hostnames without ipAddresses.
      properties:
        objectClassName: { type: string, example: nameserver }
        ldhName: { type: string, example: ns1.example.ee }
        unicodeName: { type: string }
        ipAddresses:
          type: object
          properties:
            v4: { type: array, items: { type: string, format: ipv4 } }
            v6: { type: array, items: { type: string, format: ipv6 } }

    SecureDNS:
      type: object
      description: >-
        DNSSEC delegation data. Only `keyData` (from DNSKEY records) is emitted; the service
        holds no DS records, so no `dsData` member is produced at any tier.
      properties:
        delegationSigned: { type: boolean }
        keyData:
          type: array
          items:
            type: object
            properties:
              flags: { type: integer, example: 257 }
              protocol: { type: integer, example: 3 }
              algorithm: { type: integer, example: 8 }
              publicKey: { type: string }

    Redaction:
      type: object
      description: >-
        An RFC 9537 redaction record describing a withheld field. Emitted only on domain
        responses below the privileged tier; when the array is non-empty the response's
        `rdapConformance` also carries the "redacted" token (search aggregates across rows).
        2027 categories add Registrant Organization, registry code/country, administrative and
        technical phones/codes/countries, domain/registrar last changed, Out of Zone Date,
        Deletion Date, Nameservers Last Changed Date and DNSSEC Last Changed Date. A category
        absent in source is never declared; inactive public/detailed shapes have no redacted.
        Names use emptyValue/postPath; other categories use removal/prePath.
      properties:
        name:
          type: object
          description: >-
            Identifies the redacted field: either `type` (a string from the IANA RDAP JSON
            Values / redacted-name registry) or `description` (free text). Exactly one is
            present.
          properties:
            type: { type: string, description: A registered redacted-name string. }
            description: { type: string, description: Free-text name when no registry string applies. }
        prePath:
          type: string
          description: >-
            JSONPath to the redacted member, present with `method: removal` (the member is
            absent from the response).
        postPath:
          type: string
          description: >-
            JSONPath to the emptied member, present with `method: emptyValue` (the member is
            present but its value has been cleared).
        method:
          type: string
          enum: [removal, emptyValue]
          example: removal
        reason:
          type: object
          properties:
            description: { type: string }

    Domain:
      type: object
      description: An RFC 9083 §5.3 domain object, filtered to the caller's disclosure tier.
      properties:
        rdapConformance: { $ref: '#/components/schemas/RdapConformance' }
        objectClassName: { type: string, example: domain }
        ldhName: { type: string, example: example.ee }
        unicodeName: { type: string, description: Present for IDN names. }
        status:
          type: array
          items: { type: string }
          description: The `.ee` status values mapped to the RDAP vocabulary, e.g. `active`.
        entities:
          type: array
          items: { $ref: '#/components/schemas/Entity' }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        nameservers:
          type: array
          items: { $ref: '#/components/schemas/Nameserver' }
        secureDNS: { $ref: '#/components/schemas/SecureDNS' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        lang: { type: string, example: en }
        notices:
          type: array
          description: Present on the privileged tier (the Privileged Access notice).
          items: { $ref: '#/components/schemas/Notice' }
        redacted:
          type: array
          description: Present when fields were withheld (anonymous / authenticated tiers).
          items: { $ref: '#/components/schemas/Redaction' }

    DomainSearchResults:
      type: object
      properties:
        rdapConformance: { $ref: '#/components/schemas/RdapConformance' }
        notices:
          type: array
          items: { $ref: '#/components/schemas/Notice' }
        domainSearchResults:
          type: array
          items: { $ref: '#/components/schemas/Domain' }

    Help:
      type: object
      properties:
        rdapConformance: { $ref: '#/components/schemas/RdapConformance' }
        lang: { type: string, example: en }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        farv1_openidcConfiguration:
          type: object
          description: RFC 9560 federated-authentication configuration. Present only when eeID is enabled.
          properties:
            sessionClientSupported: { type: boolean }
            tokenClientSupported: { type: boolean }
            dntSupported: { type: boolean }
            providerDiscoverySupported: { type: boolean }
            issuerIdentifierSupported: { type: boolean }
            openidcProviders:
              type: array
              items:
                type: object
                properties:
                  iss: { type: string, format: uri }
                  name: { type: string, example: eeID }
                  default: { type: boolean }
        notices:
          type: array
          items: { $ref: '#/components/schemas/Notice' }

    RdapError:
      type: object
      description: The shared RFC 9083 §6 error document used by every error response.
      properties:
        rdapConformance: { $ref: '#/components/schemas/RdapConformance' }
        lang: { type: string, example: en }
        errorCode: { type: integer, example: 404 }
        title: { type: string, example: Not Found }
        description:
          type: array
          items: { type: string }
